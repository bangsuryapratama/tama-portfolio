  </defs>

  <rect width="100" height="100" fill="url(#bg-grad)" rx="30"/>

  <text x="50" y="60" font-family="Didot, 'Bodoni MT', 'Times New Roman', serif" font-size="32" font-style="italic" fill="url(#text-grad)" text-anchor="middle" letter-spacing="4">SPR</text>

  <line x1="30" y1="70" x2="70" y2="70" stroke="#555555" stroke-width="0.5" />
