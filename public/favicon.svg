      <stop offset="0%" stop-color="#1f1f1f" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
